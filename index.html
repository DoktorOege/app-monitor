<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D4ED8">
<title>Meine Apps</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root { --bg:#F4F6FA; --card:#fff; --text:#111827; --muted:#4B5563; --line:#E5E7EB; --accent:#1D4ED8;
          --ok:#16A34A; --ok-t:#166534; --warn:#D97706; --warn-t:#92400E; --warn-bg:#FEF3C7;
          --crit:#DC2626; --crit-t:#991B1B; --crit-bg:#FEE2E2; --off:#9CA3AF; --ok-bg:#DCFCE7; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 28px 16px 40px; display:flex; flex-direction:column; gap:16px; }
  h1 { margin:0; font-size:30px; color:var(--accent); }
  .sub { margin:4px 0 0; font-size:14px; color:var(--muted); }
  .summary { border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:6px; }
  .summary b { font-size:20px; }
  .summary span { font-size:15px; }
  .s-ok { background:var(--ok-bg); color:var(--ok-t); }
  .s-warn { background:var(--warn-bg); color:var(--warn-t); }
  .s-crit { background:var(--crit-bg); color:var(--crit-t); }
  .card { background:var(--card); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:10px; box-shadow:0 1px 2px rgba(17,24,39,.06); }
  .head { display:flex; align-items:center; gap:12px; }
  .dot { width:18px; height:18px; border-radius:50%; flex:none; }
  .name { font-size:19px; font-weight:600; }
  .label { margin-left:auto; font-size:14px; font-weight:600; text-align:right; }
  .text { margin:0; font-size:15px; line-height:1.5; color:#374151; }
  .todo { margin:0; font-size:13px; color:var(--muted); }
  .track { height:12px; background:var(--line); border-radius:6px; overflow:hidden; }
  .fill { height:12px; border-radius:6px; }
  .details { display:none; flex-direction:column; gap:12px; border-top:1px solid var(--line); padding-top:12px; }
  .show-details .details { display:flex; }
  .row { display:flex; justify-content:space-between; gap:8px; font-size:13px; }
  .row span:last-child { color:var(--muted); white-space:nowrap; }
  .provider { display:flex; flex-direction:column; gap:12px; border-top:1px solid var(--line); padding-top:12px; }
  .pname { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .meter { display:flex; flex-direction:column; gap:6px; }
  .hint { font-size:12px; color:var(--muted); line-height:1.4; }
  .track { height:10px; } .fill { height:10px; }
  .legend { display:flex; flex-direction:column; gap:8px; padding:4px 4px 0; font-size:14px; color:#374151; }
  .legend div { display:flex; align-items:center; gap:10px; }
  .legend i { width:12px; height:12px; border-radius:50%; display:inline-block; }
  button.link { background:none; border:0; padding:12px 4px; font:inherit; font-size:15px; font-weight:600; color:var(--accent); text-align:left; cursor:pointer; min-height:44px; }
  .history { display:none; }
  .show-details .history { display:flex; }
  .hist-item { font-size:13px; color:#374151; display:flex; gap:10px; align-items:baseline; }
  .hist-item time { color:var(--muted); white-space:nowrap; }
  .error { background:var(--crit-bg); color:var(--crit-t); border-radius:16px; padding:16px; font-size:15px; }
</style>
</head>
<body>
<main id="app">
  <div>
    <h1>Meine Apps</h1>
    <p class="sub" id="checked">Wird geladen …</p>
  </div>
  <div id="content"></div>
</main>
<script>
const COLORS = { ok:'var(--ok)', warn:'var(--warn)', crit:'var(--crit)', off:'var(--off)' };
const TEXT = { ok:'var(--ok-t)', warn:'var(--warn-t)', crit:'var(--crit-t)', off:'var(--muted)' };
const RANK = { off:0, ok:1, warn:2, crit:3 };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

function ago(iso) {
  const d = new Date(iso), min = Math.round((Date.now() - d) / 60000);
  const time = d.toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' });
  const day = d.toDateString() === new Date().toDateString() ? 'heute' : d.toLocaleDateString('de-DE', { weekday:'short', day:'numeric', month:'numeric' });
  return { text: `Zuletzt geprüft: ${day}, ${time} Uhr`, stale: min > 150 };
}

function render(s) {
  const a = ago(s.checkedAt);
  document.getElementById('checked').textContent = a.text + (a.stale ? ' – das ist schon länger her!' : '');
  const apps = s.apps.slice().sort((x, y) => RANK[y.level] - RANK[x.level]);
  const bad = apps.filter(x => x.level === 'warn' || x.level === 'crit').length + (a.stale ? 1 : 0);
  const anyCrit = apps.some(x => x.level === 'crit') || a.stale;
  const summary = bad === 0
    ? `<div class="summary s-ok"><b>Alles läuft gut</b><span>Du musst nichts tun.</span></div>`
    : `<div class="summary ${anyCrit ? 's-crit' : 's-warn'}"><b>${bad === 1 ? '1 Ding braucht' : bad + ' Dinge brauchen'} dich</b><span>${bad < apps.length ? 'Alles andere läuft gut.' : 'Schau dir die Karten unten an.'}</span></div>`;

  const barHtml = b => `
      <div class="meter">
        <div class="row"><span>${esc(b.label)}</span><span style="color:${b.level==='ok'?'var(--muted)':TEXT[b.level]};font-weight:${b.level==='ok'?400:600}">${esc(b.text)}</span></div>
        <div class="track"><div class="fill" style="width:${Math.max(1, Math.min(100, b.pct))}%;background:${COLORS[b.level]}"></div></div>
        ${b.sub ? `<div class="hint">${esc(b.sub)}</div>` : ''}
      </div>`;
  const cards = apps.map(app => {
    const groups = (app.providers || []).map(p => {
      const bars = (app.bars || []).filter(b => b.provider === p).map(barHtml).join('');
      const facts = (app.facts || []).filter(f => f.provider === p).map(f => `<div class="hint">${esc(f.text)}</div>`).join('');
      return `<div class="provider"><div class="pname">${esc(p)}</div>${bars}${facts}</div>`;
    }).join('');
    const notes = (app.notes || []).map(n => `<div class="hint" style="color:var(--crit-t)">Fehler: ${esc(n)}</div>`).join('');
    return `
    <section class="card">
      <div class="head">
        <span class="dot" aria-hidden="true" style="background:${COLORS[app.level]}"></span>
        <span class="name">${esc(app.name)}</span>
        <span class="label" style="color:${TEXT[app.level]}">${esc(app.label)}</span>
      </div>
      <p class="text">${esc(app.text)}</p>
      ${app.todo ? `<p class="todo">Was tun? ${esc(app.todo)}</p>` : ''}
      ${groups}
      ${notes ? `<div class="details">${notes}</div>` : ''}
    </section>`;
  }).join('');

  const hist = (s.history || []).slice(0, 8).map(h => `
    <div class="hist-item"><span class="dot" aria-hidden="true" style="width:10px;height:10px;background:${COLORS[h.level]}"></span>
    <span>${esc(h.text)}</span><time>${new Date(h.t).toLocaleString('de-DE', { day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit' })}</time></div>`).join('');

  document.getElementById('content').outerHTML = `<div id="content" style="display:flex;flex-direction:column;gap:16px">
    ${a.stale ? `<div class="error">Der Monitor selbst hat seit über 2 Stunden nicht geprüft. Sag Claude Bescheid.</div>` : ''}
    ${summary}${cards}
    <div class="legend">
      <b>So liest du die Farben</b>
      <div><i style="background:var(--ok)"></i>Grün: alles gut</div>
      <div><i style="background:var(--warn)"></i>Gelb: wird knapp (ab ${s.thresholds?.warn ?? 70} %)</div>
      <div><i style="background:var(--crit)"></i>Rot: voll oder kaputt – du bekommst eine Push-Meldung</div>
    </div>
    <section class="card history" style="flex-direction:column"><b style="font-size:15px">Letzte Meldungen</b>${hist || '<span class="todo">Noch keine.</span>'}</section>
    <button class="link" id="toggle" aria-expanded="${document.body.classList.contains('show-details')}">${document.body.classList.contains('show-details') ? 'Meldungen ausblenden' : 'Letzte Meldungen anzeigen'}</button>
  </div>`;
  document.getElementById('toggle').onclick = () => { document.body.classList.toggle('show-details'); render(s); };
}

async function load() {
  try {
    const r = await fetch('status.json?t=' + Date.now(), { cache:'no-store' });
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    document.getElementById('checked').textContent = '';
    document.getElementById('content').innerHTML = '<div class="error">Noch keine Daten. Die erste Prüfung läuft gleich – schau in ein paar Minuten wieder rein.</div>';
  }
}
load();
setInterval(load, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
